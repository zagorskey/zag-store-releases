
name: Discord Release Announcements

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]
          is_test = os.environ["EVENT_NAME"] == "workflow_dispatch"
          name = ("Discord integration test" if is_test else
                  (os.environ["RELEASE_NAME"] or os.environ["RELEASE_TAG"]))
          body = ("This is a test notification. No Zag Store release was published."
                  if is_test else os.environ.get("RELEASE_BODY", "").strip())
          release_url = (os.environ["REPOSITORY_URL"] if is_test else
                         os.environ["RELEASE_URL"])

          payload = {
              "username": "Zag Store Releases",
              "embeds": [{
                  "title": f"{'🧪' if is_test else '🚀'} {name}"[:256],
                  "url": release_url,
                  "description": body[:1800] or "A new Zag Store release is available.",
                  "color": 3447003,
                  "footer": {"text": ("Zag Store • Test notification" if is_test else
                                      "Zag Store • Official GitHub Release")}
              }]
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "ZagStore-ReleaseNotifier/1.0",
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print("Discord notification sent:", response.status)
          except urllib.error.HTTPError as error:
              print("Discord webhook HTTP status:", error.code)
              # Never print the webhook URL, headers, or raw response body.
              try:
                  data = json.loads(error.read(2048).decode("utf-8"))
                  if isinstance(data, dict):
                      code = data.get("code")
                      if isinstance(code, int):
                          print("Discord API error code:", code)
              except (ValueError, UnicodeError):
                  print("Non-JSON error response (possibly an upstream block)")
              raise SystemExit(1)
          PY
